# Builds the site with the docs from pasteup and texxer and publishes it.
# Runs on a push here, daily, by hand, or when a tool repo sends a
# repository_dispatch of type "docs" after its docs change.
name: pages

on:
  push:
    branches: [main]
  schedule:
    - cron: '17 4 * * *'
  workflow_dispatch:
  repository_dispatch:
    types: [docs]

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/checkout@v4
        with: { repository: sloptools/pasteup, path: repos/pasteup, sparse-checkout: "docs\nfrontend/src/lib/Icon.svelte", sparse-checkout-cone-mode: false }
      - uses: actions/checkout@v4
        with: { repository: sloptools/texxer, path: repos/texxer, sparse-checkout: docs }
      - uses: actions/setup-node@v4
        with: { node-version: 22 }
      - run: npm ci
      - run: node build.mjs
        env: { REPOS: repos }
      - uses: actions/upload-pages-artifact@v3
        with: { path: _site }

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
